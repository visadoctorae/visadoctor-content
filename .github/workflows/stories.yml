{"name":"Render stories","on":{"push":{"paths":["stories/**","story.mjs","animate.sh",".github/workflows/stories.yml"]},"workflow_dispatch":{}},"permissions":{"contents":"write"},"concurrency":{"group":"repo-commit","cancel-in-progress":false},"jobs":{"stories":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-node@v4","with":{"node-version":"20"}},{"name":"Install ffmpeg","run":"sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg"},{"run":"npm install --no-audit --no-fund"},{"name":"Render frames","run":"mkdir -p out_stories\nfor f in stories/*.json; do n=$(basename \"$f\" .json); node story.mjs \"$f\" \"out_stories/$n\"; done"},{"name":"Animate","run":"chmod +x animate.sh\nfor d in out_stories/*/; do ./animate.sh \"$d\"; done"},{"name":"Commit","run":"git config user.name github-actions\ngit config user.email github-actions@users.noreply.github.com\ngit checkout -- . || true\ngit add -A out_stories\nif git diff --staged --quiet; then\n  echo 'nothing to commit'\n  exit 0\nfi\ngit commit -m 'render: stories + clips'\nfor i in 1 2 3 4 5; do\n  git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0\n  echo \"retry $i after push conflict...\"\n  sleep $((RANDOM % 10 + 5))\ndone\necho 'Failed to push after retries' >&2\nexit 1"}]}}}
