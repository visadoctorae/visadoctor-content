{"name":"Render stories","on":{"push":{"paths":["stories/**","story.mjs","animate.sh",".github/workflows/stories.yml"]},"workflow_dispatch":{}},"permissions":{"contents":"write"},"concurrency":{"group":"repo-commit","cancel-in-progress":false},"jobs":{"stories":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-node@v4","with":{"node-version":"20"}},{"run":"npm install --no-audit --no-fund"},{"name":"Render frames","run":"mkdir -p out_stories\nfor f in stories/*.json; do n=$(basename \"$f\" .json); node story.mjs \"$f\" \"out_stories/$n\"; done"},{"name":"Animate","run":"chmod +x animate.sh\nfor d in out_stories/*/; do ./animate.sh \"$d\"; done"},{"name":"Commit","run":"git config user.name github-actions\ngit config user.email github-actions@users.noreply.github.com\ngit add out_stories\ngit diff --staged --quiet || git commit -m 'render: stories + clips'\ngit pull --rebase origin main\ngit push"}]}}}
