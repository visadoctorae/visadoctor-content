{"name":"Render carousels","on":{"push":{},"schedule":[{"cron":"0 4 * * 1"}],"workflow_dispatch":{}},"concurrency":{"group":"repo-commit","cancel-in-progress":false},"permissions":{"contents":"write"},"jobs":{"render":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Flatten nested upload","run":"if [ ! -f render.mjs ]; then d=$(find . -maxdepth 3 -name render.mjs -not -path './node_modules/*' | head -1); dir=$(dirname \"$d\"); echo \"flattening from $dir\"; cp -r \"$dir\"/. .; fi; ls -la; ls decks | head"},{"uses":"actions/setup-node@v4","with":{"node-version":"20"}},{"run":"npm install --no-audit --no-fund"},{"name":"Render decks","run":"mkdir -p out; for f in decks/*.json; do node render.mjs \"$f\" \"out/$(basename \"$f\" .json)\"; done; find out -name '*.png' | wc -l"},{"name":"Commit slides","run":"git config user.name gh-bot\ngit config user.email gh-bot@users.noreply.github.com\ngit add -f out\ngit diff --staged --quiet || git commit -m 'render slides'\ngit pull --rebase origin main\ngit push"}]}}}
