{"name":"Render carousels","on":{"push":{"paths":["decks/**","render.mjs"]},"schedule":[{"cron":"0 4 * * 1"}],"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"render":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-node@v4","with":{"node-version":"20"}},{"run":"npm install --no-audit --no-fund"},{"name":"Render decks","run":"mkdir -p out\nfor f in decks/*.json; do node render.mjs \"$f\" \"out/$(basename \"$f\" .json)\"; done"},{"name":"Commit slides","run":"git config user.name gh-bot\ngit config user.email gh-bot@users.noreply.github.com\ngit add out\ngit diff --staged --quiet || git commit -m 'render slides'\ngit push"}]}}}
