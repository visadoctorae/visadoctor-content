{"name":"Render carousels","on":{"push":{"paths":["decks/**","render.mjs",".github/workflows/render.yml"]},"schedule":[{"cron":"0 4 * * 1"}],"workflow_dispatch":{}},"concurrency":{"group":"repo-commit","cancel-in-progress":false},"permissions":{"contents":"write"},"jobs":{"render":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Flatten nested upload","run":"if [ ! -f render.mjs ]; then\n  d=$(find . -maxdepth 3 -name render.mjs -not -path \"./node_modules/*\" | head -1)\n  dir=$(dirname \"$d\")\n  echo \"flattening from $dir\"\n  cp -r \"$dir\"/. .\nfi\nls -la\nls decks | head"},{"uses":"actions/setup-node@v4","with":{"node-version":"20"}},{"run":"npm install --no-audit --no-fund"},{"name":"Render decks","run":"mkdir -p out\nfor f in decks/*.json; do node render.mjs \"$f\" \"out/$(basename \"$f\" .json)\"; done\nfind out -name '*.png' | wc -l"},{"name":"Commit slides","run":"git config user.name gh-bot\ngit config user.email gh-bot@users.noreply.github.com\ngit checkout -- . || true\ngit add -f out\nif git diff --staged --quiet; then\n  echo 'nothing to commit'\n  exit 0\nfi\ngit commit -m 'render slides'\nfor i in 1 2 3 4 5; do\n  git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0\n  echo \"retry $i after push conflict...\"\n  sleep $((RANDOM % 10 + 5))\ndone\necho 'Failed to push after retries' >&2\nexit 1"}]}}}
